<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видео → SRT (по 3 слова)</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5d6572;
    --line: #d6dae1; --accent: #1f5eff; --accent-text: #ffffff; --ok: #14804a; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --text: #eceef2; --muted: #98a1b0;
      --line: #343a45; --accent: #6b93ff; --accent-text: #0c1020; --ok: #4cc28a; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px 14px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--accent); }
  .drop b { display: block; font-size: 17px; margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 12px; }
  .row > label { flex: 1; }
  label { display: block; font-size: 14px; color: var(--muted); margin-top: 12px; }
  select, input[type=number] { width: 100%; margin-top: 4px; padding: 11px 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  button { width: 100%; padding: 14px; font-size: 17px; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); margin-top: 14px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 10px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  progress { width: 100%; height: 10px; margin-top: 12px; }
  #status { margin-top: 12px; font-size: 14px; white-space: pre-wrap; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  textarea { width: 100%; min-height: 220px; margin-top: 10px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  details { margin-top: 12px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Видео → SRT по 3 слова</h1>

  <div class="card">
    <div class="drop" id="drop">
      <b>Выбрать видео или аудио</b>
      <span class="muted" id="fileName">Файл не выбран</span>
      <input type="file" id="file" accept="video/*,audio/*" hidden>
    </div>

    <div class="row">
      <label>Слов в блоке
        <input type="number" id="maxWords" min="1" max="10" value="3" inputmode="numeric">
      </label>
      <label>Язык речи
        <select id="lang">
          <option value="russian">Русский</option>
          <option value="german">Немецкий</option>
          <option value="english">Английский</option>
        </select>
      </label>
    </div>

    <label>Модель
      <select id="model">
        <option value="onnx-community/whisper-base_timestamped">Base: точнее, ~80 МБ</option>
        <option value="onnx-community/whisper-tiny_timestamped">Tiny: быстрее, хуже качество, ~40 МБ</option>
      </select>
    </label>

    <button id="go" disabled>Сделать .srt</button>
    <progress id="bar" max="100" value="0" hidden></progress>
    <div id="status"></div>
    <details>
      <summary>Как это работает</summary>
      <p>Всё происходит на самом устройстве: файл никуда не отправляется. При первом запуске скачивается модель распознавания речи, потом она хранится в кэше браузера. Нужен интернет только для первой загрузки.</p>
    </details>
  </div>

  <div class="card" id="result" hidden>
    <b>Готово</b>
    <textarea id="srtText" readonly></textarea>
    <button id="dl">Скачать .srt</button>
    <button class="ghost" id="share">Поделиться / сохранить в Файлы</button>
    <button class="ghost" id="copy">Копировать текст</button>
  </div>
</main>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0";

env.allowLocalModels = false;

const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), go = $("go"), bar = $("bar"), statusEl = $("status");
let file = null;
let asr = null, loadedModel = null;
let lastSrt = "", lastName = "subs";
let realtimeMode = false;

function setStatus(text, kind = "") { statusEl.textContent = text; statusEl.className = kind; }

function setFile(f) {
  file = f;
  $("fileName").textContent = `${f.name} (${(f.size / 1048576).toFixed(1)} МБ)`;
  go.disabled = false;
  realtimeMode = false;
  $("result").hidden = true;
  setStatus("");
}

drop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => { if (e.target.files[0]) setFile(e.target.files[0]); });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});

// Ресемплинг в 16 кГц моно
async function resampleTo16k(data, sampleRate) {
  const length = Math.ceil(data.length * 16000 / sampleRate);
  const off = new OfflineAudioContext(1, length, 16000);
  const buf = off.createBuffer(1, data.length, sampleRate);
  buf.copyToChannel(data, 0);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  return rendered.getChannelData(0);
}

// Способ 1: быстрое декодирование файла целиком
async function decodeTo16kMono(f) {
  const buf = await f.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(buf);
  } catch (e) {
    const err = new Error("decode failed");
    err.code = "DECODE";
    throw err;
  } finally {
    if (ctx.close) ctx.close();
  }
  const mono = decoded.getChannelData(0);
  return resampleTo16k(mono, decoded.sampleRate);
}

// Способ 2: проигрываем видео и записываем звук (идёт в реальном времени, зато понимает MOV)
// Вызывать нужно сразу из обработчика нажатия, иначе iOS не даст запустить воспроизведение.
function recordViaPlayback(f, onProgress) {
  return new Promise((resolve, reject) => {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    if (ctx.resume) ctx.resume();
    const video = document.createElement("video");
    video.setAttribute("playsinline", "");
    video.playsInline = true;
    video.preload = "auto";
    const url = URL.createObjectURL(f);
    video.src = url;

    const chunks = [];
    let total = 0;
    const source = ctx.createMediaElementSource(video);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = (e) => {
      chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      total += chunks[chunks.length - 1].length;
    };
    source.connect(proc);
    proc.connect(ctx.destination); // на выход идёт тишина, но без этого узел не работает

    const timer = setInterval(() => {
      if (video.duration) onProgress(video.currentTime, video.duration);
    }, 500);

    const cleanup = () => {
      clearInterval(timer);
      try { proc.disconnect(); source.disconnect(); } catch (e) {}
      if (ctx.close) ctx.close();
      URL.revokeObjectURL(url);
    };

    video.addEventListener("error", () => {
      cleanup();
      reject(new Error("Браузер не смог открыть этот файл. Попробуй mp4 или m4a."));
    });
    video.addEventListener("ended", async () => {
      const sr = ctx.sampleRate;
      cleanup();
      const all = new Float32Array(total);
      let o = 0;
      for (const c of chunks) { all.set(c, o); o += c.length; }
      try { resolve(await resampleTo16k(all, sr)); } catch (e) { reject(e); }
    });

    const p = video.play();
    if (p && p.catch) p.catch(() => {
      cleanup();
      reject(new Error("Браузер не разрешил воспроизведение. Нажми кнопку ещё раз."));
    });
  });
}

function fmt(t) {
  t = Math.max(0, t);
  const ms = Math.round(t * 1000);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000),
        s = Math.floor(ms % 60000 / 1000), r = ms % 1000;
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(h)}:${p(m)}:${p(s)},${p(r, 3)}`;
}

// Группируем слова в блоки по N слов; длинная пауза тоже рвёт блок
function buildSrt(words, maxWords) {
  const blocks = [];
  let cur = null;
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const text = (w.text || "").trim();
    if (!text) continue;
    const start = w.timestamp[0] ?? (cur ? cur.end : 0);
    let end = w.timestamp[1];
    if (end == null || end < start) end = start + 0.3;
    const gap = cur ? start - cur.end : 0;
    if (!cur || cur.words.length >= maxWords || gap > 0.9) {
      cur = { start, end, words: [text] };
      blocks.push(cur);
    } else {
      cur.words.push(text);
      cur.end = end;
    }
  }
  // убираем наложения по времени
  for (let i = 0; i < blocks.length - 1; i++) {
    if (blocks[i].end > blocks[i + 1].start) blocks[i].end = blocks[i + 1].start;
    if (blocks[i].end <= blocks[i].start) blocks[i].end = blocks[i].start + 0.05;
  }
  return blocks.map((b, i) => `${i + 1}\n${fmt(b.start)} --> ${fmt(b.end)}\n${b.words.join(" ")}\n`).join("\n");
}

async function loadModel(id) {
  if (asr && loadedModel === id) return asr;
  asr = null;
  bar.hidden = false; bar.value = 0;
  setStatus("Загружаю модель (в первый раз это займёт время)...");
  const progress = (p) => {
    if (p.status === "progress" && typeof p.progress === "number") {
      bar.value = p.progress;
      setStatus(`Загружаю модель: ${Math.round(p.progress)}%`);
    }
  };
  try {
    asr = await pipeline("automatic-speech-recognition", id, {
      device: "wasm", dtype: "q8", progress_callback: progress
    });
  } catch (e) {
    // запасной вариант с другим типом квантования
    asr = await pipeline("automatic-speech-recognition", id, {
      device: "wasm", progress_callback: progress
    });
  }
  loadedModel = id;
  return asr;
}

go.addEventListener("click", async () => {
  if (!file) return;
  go.disabled = true;
  $("result").hidden = true;
  try {
    const maxWords = Math.min(10, Math.max(1, parseInt($("maxWords").value, 10) || 3));
    const language = $("lang").value;

    bar.hidden = false; bar.removeAttribute("value");
    let audio;
    if (realtimeMode) {
      setStatus("Записываю звук через воспроизведение. Не сворачивай вкладку, это займёт столько, сколько длится видео.");
      audio = await recordViaPlayback(file, (t, d) => {
        setStatus(`Записываю звук: ${Math.round(t)} из ${Math.round(d)} с. Не сворачивай вкладку.`);
      });
    } else {
      setStatus("Читаю звук из файла...");
      try {
        audio = await decodeTo16kMono(file);
      } catch (e) {
        if (e.code === "DECODE") {
          realtimeMode = true;
          setStatus("Быстро прочитать звук не вышло (так бывает с MOV). Нажми «Сделать .srt» ещё раз: я запишу звук через воспроизведение.", "err");
          return;
        }
        throw e;
      }
    }

    const model = await loadModel($("model").value);

    setStatus("Распознаю речь... Не закрывай и не сворачивай вкладку.");
    bar.removeAttribute("value");
    const out = await model(audio, {
      language, task: "transcribe",
      return_timestamps: "word",
      chunk_length_s: 30, stride_length_s: 5
    });

    const words = out.chunks || [];
    if (!words.length) throw new Error("Речь не найдена. Проверь язык и звук в файле.");

    lastSrt = buildSrt(words, maxWords);
    lastName = file.name.replace(/\.[^/.]+$/, "") + `_${maxWords}words`;
    $("srtText").value = lastSrt;
    $("result").hidden = false;
    setStatus(`Готово: ${words.length} слов.`, "ok");
    $("result").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    console.error(err);
    setStatus("Ошибка: " + (err && err.message ? err.message : err), "err");
  } finally {
    bar.hidden = true;
    go.disabled = false;
  }
});

function srtBlob() { return new Blob([lastSrt], { type: "application/x-subrip;charset=utf-8" }); }

$("dl").addEventListener("click", () => {
  const url = URL.createObjectURL(srtBlob());
  const a = document.createElement("a");
  a.href = url; a.download = lastName + ".srt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});

$("share").addEventListener("click", async () => {
  const f = new File([lastSrt], lastName + ".srt", { type: "text/plain" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: f.name });
    } else {
      setStatus("Поделиться файлом здесь нельзя, используй «Скачать .srt».", "err");
    }
  } catch (e) { /* пользователь закрыл окно */ }
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(lastSrt);
    setStatus("Текст скопирован.", "ok");
  } catch (e) {
    $("srtText").select();
    setStatus("Выдели текст в поле и скопируй вручную.", "err");
  }
});
</script>
</body>
</html>
